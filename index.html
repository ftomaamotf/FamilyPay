<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>الصندوق والحسابات المشتركة</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script>
      // Register Service Worker for background push notifications and refresh stale app shells.
      if ('serviceWorker' in navigator) {
        var hadController = Boolean(navigator.serviceWorker.controller);
        var refreshingForUpdate = false;

        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!hadController || refreshingForUpdate) return;
          refreshingForUpdate = true;
          window.location.reload();
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(function(reg) {
              console.log('✅ Service Worker registered for background push:', reg.scope);
              reg.update().catch(function(updateErr) {
                console.log('Service Worker update note:', updateErr);
              });
            })
            .catch(function(err) {
              console.log('Service Worker registration note:', err);
            });
        });
      }
    </script>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الصندوق والحسابات المشتركة" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased select-none selection:bg-emerald-500 selection:text-white pb-20 md:pb-6">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
